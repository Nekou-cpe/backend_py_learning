<!DOCTYPE html>
<html>
    <head>
        <title>youtube.com Clone</title>
        <style>
            .div-video{
                width: 300px;
                display: inline-block;
                vertical-align: center;
                margin-right: 15px;
            }
            .photo{
                width: 287px;
                height: 176;
                display: block;
                margin-bottom: 8px;
                border-radius: 5px;
                
            }
            .search{
                font-size: 14px;
                display: block;

            }
            .search:hover{
                opacity: 0.7;
            }
            .about-video{
                
                font-weight: bold;
                font-size: 18px;
                font-family: Arial, Helvetica, sans-serif;
                margin-bottom: 0px;
                margin-top: 0px;
            }
            .from{
                display: inline-block;
                font-size: 12px;
                color: rgb(68, 69, 70);
                margin-top: 10px;
                margin-bottom: 0px;
                
            }
            .view{
                
                font-size: 12px;
                color: rgb(116, 118, 119);
                margin-top: 0px;

            }
            .chanel-pic{
                display: inline-block;
                width: 50px;
                vertical-align: top;
            }
            .profile-pic{
                width: 40px;
                border-radius: 50px;
            }
            .video-info{
                display: inline-block;
                width: 200px;
            }
        </style>

    </head>
    <body>
        <input class="search" type="text" placeholder="Search">


        <div class="div-video">
            <div>
                <img class="photo" src="photos/p1.jpg" alt="phothograpy">
            </div>
            <div>
                <div class="chanel-pic">
                    <img class="profile-pic" src="profile/channel-4.jpeg" alt="profile">
                </div>
                <div class="video-info">
                    <p class="about-video">
                        Talking about myself
                    </p>
                    <p class="from">
                        Nekou Dfrm
                    </p>
                    <p class="view">2.3M views &#183; 6 days ago

                    </p>
                </div>

            </div>
        </div>
        <div class="div-video">
            <div>
                <img class="photo" src="photos/p2.jpg" alt="phothograpy">
            </div>
            <div>
                <div class="chanel-pic">
                    <img class="profile-pic" src="profile/channel-2.jpeg" alt="profile">
                </div>
                <div class="video-info">
                    <p class="about-video">
                        Talking about myself
                    </p>
                    <p class="from">
                        Nekou Dfrm
                    </p>
                    <p class="view">2.3M views &#183; 6 days ago

                    </p>
                </div>

            </div>
        </div>


    </body>
</html>
